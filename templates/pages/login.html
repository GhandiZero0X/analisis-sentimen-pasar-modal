{% extends "layout/baseAuthAdmin.html" %}

{% block title %}Login{% endblock %}

{% block content %}
<div class="card-body">
  <div class="pt-4 pb-2">
    <h5 class="card-title text-center pb-0 fs-4">Login to Your Account</h5>
    <p class="text-center small">Enter your email & password to login</p>
  </div>

  <form class="row g-3 needs-validation" novalidate action="{{ url_for('routes.dashboard_get') }}" method="POST">
    <div class="col-12">
      <label for="yourEmail" class="form-label">Your Email</label>
      <input
        type="email"
        name="email"
        class="form-control"
        id="yourEmail"
        required
        autocomplete="email"
        placeholder="Enter your email"
      />
      <div class="invalid-feedback">Please enter a valid email address.</div>
    </div>

    <div class="col-12">
      <label for="yourPassword" class="form-label">Password</label>
      <input
        type="password"
        name="password"
        class="form-control"
        id="yourPassword"
        required
        placeholder="Enter your password"
      />
      <div class="invalid-feedback">Please enter your password!</div>
    </div>

    <div class="col-12">
      <button class="btn btn-primary w-100" type="submit">Login</button>
    </div>
    <div class="col-12">
      <p class="small mb-0">
        Don't have account?
        <a href="{{ url_for('routes.register_get') }}">Create an account</a>
      </p>
    </div>
  </form>
</div>
{% endblock %}
