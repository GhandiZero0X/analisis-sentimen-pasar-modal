{% extends "layout/baseAdmin.html" %}

{% block title %}Edit Account{% endblock %}

{% block content %}
<div class="pagetitle">
  <h1>List Account</h1>
  <nav>
    <ol class="breadcrumb">
      <li class="breadcrumb-item"><a href="{{ url_for('routes.dashboard_get') }}">Home</a></li>
      <li class="breadcrumb-item">
        <a href="{{ url_for('routes.list_accounts_get') }}">List Account</a>
      </li>
      <li class="breadcrumb-item active">Edit Account</li>
    </ol>
  </nav>
</div>
<!-- End Page Title -->

<section class="section dashboard">
  <div class="row">
    <div class="col-xl-16">
      <div class="card">
        <div class="card-body pt-3">
          <!-- Bordered Tabs -->
          <ul class="nav nav-tabs nav-tabs-bordered">
            <li class="nav-item">
              <button
                class="nav-link active"
                data-bs-toggle="tab"
                data-bs-target="#profile-edit"
              >
                Edit Account
              </button>
            </li>
            <li class="nav-item">
              <button
                class="nav-link"
                data-bs-toggle="tab"
                data-bs-target="#profile-change-password"
              >
                Change Password
              </button>
            </li>
          </ul>

          <div class="tab-content pt-2">
            <div class="tab-pane fade show active pt-3" id="profile-edit">
              <!-- Profile Edit Form -->
              <form
                action="{{ url_for('routes.list_accounts_get') }}"
                enctype="multipart/form-data"
                class="row g-3 needs-validation"
                novalidate
              >
                <div class="row mb-3">
                  <label
                    for="profileImage"
                    class="col-md-4 col-lg-3 col-form-label"
                  >
                    Profile Image
                  </label>
                  <div class="col-md-8 col-lg-9">
                    <img
                      src="{{ url_for('static', filename='img/avatar_1.jpg') }}"
                      style="max-width: 20%"
                      alt="Profile"
                    />
                    <div class="pt-2">
                      <a
                        href="#"
                        class="btn btn-primary btn-sm"
                        title="Upload new profile image"
                      >
                        <i class="bi bi-upload"></i>
                      </a>
                      <a
                        href="#"
                        class="btn btn-danger btn-sm"
                        title="Remove my profile image"
                      >
                        <i class="bi bi-trash"></i>
                      </a>
                    </div>
                  </div>
                </div>
                <div class="row mb-3">
                  <label
                    for="fullName"
                    class="col-md-4 col-lg-3 col-form-label"
                  >
                    Full Name
                  </label>
                  <div class="col-md-8 col-lg-9">
                    <input
                      name="fullName"
                      type="text"
                      class="form-control"
                      id="fullName"
                      value="Muhamad Ghandi Nur Setiawan"
                    />
                  </div>
                </div>
                <div class="row mb-3">
                  <label for="company" class="col-md-4 col-lg-3 col-form-label">
                    Company
                  </label>
                  <div class="col-md-8 col-lg-9">
                    <input
                      name="company"
                      type="text"
                      class="form-control"
                      id="company"
                      value="StockSenseID"
                    />
                  </div>
                </div>
                <div class="row mb-3">
                  <label for="Role" class="col-md-4 col-lg-3 col-form-label">
                    Role
                  </label>

                  <div class="col-md-8 col-lg-9">
                    <select name="role" class="form-select" id="Role">
                      <option value="Super Admin" selected>Super Admin</option>

                      <option value="Admin">Admin</option>
                    </select>
                  </div>
                </div>
                <div class="row mb-3">
                  <label for="Country" class="col-md-4 col-lg-3 col-form-label">
                    Country
                  </label>
                  <div class="col-md-8 col-lg-9">
                    <input
                      name="country"
                      type="text"
                      class="form-control"
                      id="Country"
                      value="IDN"
                    />
                  </div>
                </div>
                <div class="row mb-3">
                  <label for="Phone" class="col-md-4 col-lg-3 col-form-label">
                    Phone
                  </label>
                  <div class="col-md-8 col-lg-9">
                    <input
                      name="phone"
                      type="text"
                      class="form-control"
                      id="Phone"
                      value="085856490085"
                    />
                  </div>
                </div>
                <div class="row mb-3">
                  <label for="Email" class="col-md-4 col-lg-3 col-form-label">
                    Email
                  </label>
                  <div class="col-md-8 col-lg-9">
                    <input
                      name="email"
                      type="email"
                      class="form-control"
                      id="Email"
                      value="hgrphantom01@gmail.com"
                    />
                  </div>
                </div>
                <div class="text-center">
                  <button type="submit" class="btn btn-primary">
                    Save Changes
                  </button>
                </div>
              </form>
              <!-- End Profile Edit Form -->
            </div>
            <div class="tab-pane fade pt-3" id="profile-change-password">
              <!-- Change Password Form -->
              <form
                action="{{ url_for('routes.list_accounts_get') }}"
                class="row g-3 needs-validation"
                novalidate
              >
                <div class="row mb-3">
                  <label
                    for="currentPassword"
                    class="col-md-4 col-lg-3 col-form-label"
                  >
                    Current Password
                  </label>
                  <div class="col-md-8 col-lg-9">
                    <input
                      name="password"
                      type="password"
                      class="form-control"
                      id="currentPassword"
                    />
                  </div>
                </div>

                <div class="row mb-3">
                  <label
                    for="newPassword"
                    class="col-md-4 col-lg-3 col-form-label"
                  >
                    New Password
                  </label>
                  <div class="col-md-8 col-lg-9">
                    <input
                      name="newpassword"
                      type="password"
                      class="form-control"
                      id="newPassword"
                    />
                  </div>
                </div>

                <div class="row mb-3">
                  <label
                    for="renewPassword"
                    class="col-md-4 col-lg-3 col-form-label"
                  >
                    Re-enter New Password
                  </label>
                  <div class="col-md-8 col-lg-9">
                    <input
                      name="renewpassword"
                      type="password"
                      class="form-control"
                      id="renewPassword"
                    />
                  </div>
                </div>

                <div class="text-center">
                  <button type="submit" class="btn btn-primary">
                    Change Password
                  </button>
                </div>
              </form>
              <!-- End Change Password Form -->
            </div>
          </div>
          <!-- End Bordered Tabs -->
        </div>
      </div>
    </div>
  </div>
</section>
{% endblock %}
