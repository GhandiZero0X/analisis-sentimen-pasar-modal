<!-- partials/header.html -->
<!-- ======= Header ======= -->
<header id="header" class="header fixed-top d-flex align-items-center">
  <!-- Start Logo -->
  <div class="d-flex align-items-center justify-content-between">
    <a href="{{ url_for('routes.dashboard_get') }}" class="logo d-flex align-items-center">
      <img src="{{ url_for('static', filename='img/Logo_StockSenseID.png') }}" alt="" />
      <span class="d-none d-lg-flex align-items-center mb-0">StockSenseID</span>
    </a>
    <i class="bi bi-list toggle-sidebar-btn"></i>
  </div>
  <!-- End Logo -->

  <!-- Start Icons Navigation -->
  <nav class="header-nav ms-auto">
    <ul class="d-flex align-items-center">
      <!-- Start Profile Dropdown Items -->
      <li class="nav-item dropdown pe-3">
        <!-- Start Profile Image Icon -->
        <a
          class="nav-link nav-profile d-flex align-items-center pe-0"
          href="#"
          data-bs-toggle="dropdown"
        >
          <img src="{{ url_for('static', filename='img/' + session.get('user_photo', 'avatar_default.jpg')) }}" alt="Profile" class="rounded-circle" />
          <span class="d-none d-md-block dropdown-toggle ps-2">
            {{ session.get('user_name', 'Guest') }}
          </span>
        </a>
        <!-- End Profile Image Icon -->
        <!-- Start Profile Dropdown Items -->
        <ul class="dropdown-menu dropdown-menu-end dropdown-menu-arrow profile">
          <li class="dropdown-header">
            <h6>{{ session.get('user_name', 'Guest') }}</h6>
            <span>{{ session.get('user_role', 'User')|title }}</span>
          </li>
          <li>
            <hr class="dropdown-divider" />
          </li>

          <li>
            <a
              class="dropdown-item d-flex align-items-center"
              href="profile.html"
            >
              <i class="bi bi-person"></i>
              <span>My Profile</span>
            </a>
          </li>
          <li>
            <hr class="dropdown-divider" />
          </li>

          <li>
            <form action="{{ url_for('routes.logout') }}" method="POST" class="m-0 p-0">
              <button type="submit" class="dropdown-item d-flex align-items-center">
                <i class="bi bi-box-arrow-right"></i>
                <span>Logout</span>
              </button>
            </form>
          </li>
        </ul>
        <!-- End Profile Dropdown Items -->
      </li>
      <!-- End Profile Nav -->
    </ul>
  </nav>
  <!-- End Icons Navigation -->
</header>
<!-- End Header -->
